# RocketMQ Broker 配置（Phase 2：消息化与异步化）
# 本机 Docker 联调配置；生产环境请按集群规划修改

# 集群名称（本机单机示例；生产多 broker 同名组成集群）
brokerClusterName=DefaultCluster
# broker 名称（同集群内唯一；主备同名的才是主备关系）
brokerName=broker-a
# brokerId：0=Master，>0=Slave
brokerId=0
# NameServer 地址（容器内通过 docker 网络 DNS 访问 namesrv 容器）
namesrvAddr=rmqnamesrv:9876
# 注册给客户端的 broker 地址：必须是宿主机可达的 IP/域名
# （broker 容器内网 IP 宿主机访问不到，这里写宿主机环回地址做本地联调）
brokerIP1=127.0.0.1
# broker 监听端口（容器内；docker 映射 10911->10911 到宿主机）
listenPort=10911
# 自动创建 Topic：开发期方便，生产建议关闭并由运维预建
autoCreateTopicEnable=true
# 自动创建消费者组
autoCreateSubscriptionGroup=true
# 消息存储根目录（容器内路径，挂载 volume 可持久化）
storePathRootDir=/home/rocketmq/store
storePathCommitLog=/home/rocketmq/store/commitlog
# 单个文件大小（4G 为默认，本地可调小省磁盘）
mapedFileSizeCommitLog=1073741824
# 允许的最大消息大小（4M，默认）
maxMessageSize=4194304
